[package]
name = "bizik"
version = "0.1.0"
edition = "2024"
description = "Remote agent session manager: mark folders on your servers, launch and watch Claude/Codex sessions from one screen"

[[bin]]
name = "bzk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
